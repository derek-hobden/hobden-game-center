<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="180" y2="512">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <radialGradient id="blobSky" cx="18%" cy="14%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobSun" cx="86%" cy="4%" r="36%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobMint" cx="58%" cy="96%" r="46%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pad" gradientUnits="userSpaceOnUse" x1="256" y1="130" x2="256" y2="390">
